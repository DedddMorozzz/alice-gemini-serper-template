name: Check webhook syntax and behavior
on:
  push:
    branches: [fix/gemini-timeouts]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: node --check api/index.js
      - name: Test webhook behavior
        run: node --test tests/webhook.test.mjs
